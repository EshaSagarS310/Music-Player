<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBeat | Premium Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/animations.css">
    <link rel="stylesheet" href="assets/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container glass-panel">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-waveform neon-text"></i>
                <span>PulseBeat</span>
            </div>
            <nav class="nav-menu">
                <a href="#" data-page="home" class="nav-link active"><i class="fa-solid fa-home"></i> Home</a>
                <a href="#" data-page="playlist" class="nav-link"><i class="fa-solid fa-list-music"></i> Playlists</a>
                <a href="#" data-page="favorites" class="nav-link"><i class="fa-solid fa-heart"></i> Favorites</a>
                <a href="#" data-page="profile" class="nav-link"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="#" data-page="settings" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
                
                <div style="margin-top: 20px; padding: 0 1rem;">
        <p style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Your Playlists</p>
        <ul id="sidebar-playlists-list" style="list-style: none;">
            <!-- Dynamic list injected here -->
        </ul>
    </div>
            
            </nav>
        </aside>
        
        <!-- Main Content (Dynamic Routing) -->
        <main class="main-content" id="app-content">
            <!-- Pages inject here -->
        </main>
    </div>

    <!-- Floating Music Player -->
    <div class="music-player glass-panel" id="music-player">
        <div class="player-track-info">
            <div class="album-art" id="album-art-container">
                <img src="images/banner.png" alt="Album Art" id="cover-img">
            </div>
            <div class="track-details">
                <h4 id="track-title">Select a Song</h4>
                <p id="track-artist">PulseBeat</p>
            </div>
            <button class="icon-btn" id="like-btn"><i class="fa-regular fa-heart"></i></button>
        </div>

        <div class="player-controls-container">
            <div class="player-controls">
                <button class="icon-btn" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="icon-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn neon-glow" id="play-btn"><i class="fa-solid fa-play"></i></button>
                <button class="icon-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button class="icon-btn" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>


        <div class="player-actions">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            <button class="icon-btn" id="fullscreen-btn"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Audio Element -->
    <audio id="audio-source"></audio>

    <!-- Scripts -->
    <script src="data/songs.js"></script>
    <script src="components/storage.js"></script>
    <script src="components/theme.js"></script>
    <script src="components/player.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="script.js"></script>
</body>
</html>
