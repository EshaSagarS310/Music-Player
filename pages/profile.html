<div class="profile-container fade-in-page" style="display: flex; justify-content: center; padding-top: 20px;">
    
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 50px 30px; border-radius: 40px; text-align: center; position: relative; border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0, 240, 255, 0.01) 100%);">
        
        <div id="status-bar" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100px; height: 4px; background: var(--primary-color); border-radius: 0 0 10px 10px; box-shadow: 0 0 15px var(--primary-color); display: none;"></div>

        <div style="margin-bottom: 25px; display: inline-block; position: relative;">
            <div style="width: 160px; height: 160px; border-radius: 35% 65% 70% 30% / 30% 40% 60% 70%; background: var(--glass-bg); border: 2px solid var(--primary-color); display: flex; align-items: center; justify-content: center; overflow: hidden; animation: morph 8s ease-in-out infinite;">
                <i class="fa-solid fa-headphones neon-text" style="font-size: 4rem;"></i>
            </div>
        </div>

        <h1 id="user-display-name" style="font-size: 2.8rem; margin: 0; font-weight: 800; color: #fff; letter-spacing: -1px;">Esha Sagar S</h1>
        
        <div id="listening-badge" style="display: none; justify-content: center; align-items: center; gap: 10px; margin: 15px 0;">
            <span style="padding: 5px 15px; background: rgba(0, 240, 255, 0.1); color: var(--primary-color); border-radius: 30px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(0, 240, 255, 0.3);">
                <i class="fa-solid fa-volume-high" style="margin-right: 5px;"></i> 
                NOW VIBING: <span id="profile-current-song" style="color: #fff; text-transform: uppercase;"></span>
            </span>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.05); margin: 30px 0;">

        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 35px; gap: 15px;">
    <p style="color: var(--text-secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; margin: 0;">Audio Pulse</p>
    
    <div style="display: flex; align-items: flex-end; gap: 4px; height: 40px; padding: 10px 20px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);">
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
        <div class="eq-bar-visual"></div>
    </div>
</div>

        <button onclick="window.editProfile()" style="width: 100%; padding: 16px; border-radius: 20px; border: none; background: var(--primary-color); color: #000; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s; transform: perspective(1px) translateZ(0);">
            RENAME IDENTITY
        </button>
    </div>
</div>
